<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 
    ================================================================
    1. 브랜딩 컬러 셰이더 면
       - [ORANGE] 상향 6개 삼각형 (Δ)
       - [BLUE] 하향 6개 삼각형 (∇)
    ================================================================
  -->
  <g stroke="none">
    <!-- [ORANGE #ED5B2A] -->
    <polygon points="256,64 311.4,160 200.6,160" fill="#ED5B2A" />
    <polygon points="366.9,256 422.3,352 311.4,352" fill="#ED5B2A" />
    <polygon points="145.1,256 200.6,352 89.7,352" fill="#ED5B2A" />
    <polygon points="200.6,160 311.4,160 256,256" fill="#ED5B2A" />
    <polygon points="256,256 366.9,256 311.4,352" fill="#ED5B2A" />
    <polygon points="145.1,256 256,256 200.6,352" fill="#ED5B2A" />

    <!-- [BLUE #00A8E8] -->
    <polygon points="200.6,352 311.4,352 256,448" fill="#00A8E8" />
    <polygon points="89.7,160 200.6,160 145.1,256" fill="#00A8E8" />
    <polygon points="311.4,160 422.3,160 366.9,256" fill="#00A8E8" />
    <polygon points="311.4,160 366.9,256 256,256" fill="#00A8E8" />
    <polygon points="256,256 311.4,352 200.6,352" fill="#00A8E8" />
    <polygon points="200.6,160 256,256 145.1,256" fill="#00A8E8" />
  </g>

  <!-- 
    ================================================================
    2. 선명한 솔리드 화이트 선 (#FFFFFF / 균일 10px)
       어두운 배경에서도 파랑과 주황을 확실하게 분리해주는 그리드
    ================================================================
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- 정방향 큰 삼각형 외곽 -->
    <polygon points="256,64 422.3,352 89.7,352" />
    
    <!-- 역방향 큰 삼각형 외곽 -->
    <polygon points="256,448 89.7,160 422.3,160" />

    <!-- 내부 3개 평행 관통선 -->
    <line x1="145.1" y1="256" x2="366.9" y2="256" />
    <line x1="200.6" y1="160" x2="311.4" y2="352" />
    <line x1="311.4" y1="160" x2="200.6" y2="352" />
  </g>
</svg>